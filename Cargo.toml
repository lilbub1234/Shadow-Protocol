[package]
name = "shroud-framework"
version = "0.1.0"
edition = "2021"
authors = ["Shroud Protocol Contributors"]
license = "MIT"
description = "Next-generation zero-knowledge privacy platform with visual no-code builder"
homepage = "https://shadeframework.io"
repository = "https://github.com/shroud-protocol/shroud"
documentation = "https://docs.shadeframework.io"
readme = "README.md"
keywords = ["zero-knowledge", "zk-snarks", "privacy", "cryptography", "blockchain"]
categories = ["cryptography", "development-tools", "no-std"]

[workspace]
members = [
    "core",
    "visual-builder",
    "zkvm",
    "proof-systems/*",
    "privacy-apps",
    "plugins",
    "ai-assistant",
    "sdk/rust",
    "cli",
]

[dependencies]
# Core cryptographic primitives
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"

# Proof systems
bellman = "0.14"
plonky2 = "0.2"
winterfell = "0.7" # STARK
nova-snark = "0.31"

# Cryptographic utilities
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# ZK-friendly hash functions
poseidon-rs = "0.0.10"
rescue-hash = "0.1"

# Merkle trees
rs_merkle = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web server (for visual builder backend)
actix-web = "4.4"
actix-ws = "0.2"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls"] }

# CLI
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }
colored = "2.1"
indicatif = "0.17"
dialoguer = "0.11"

# Configuration
toml = "0.8"
config = "0.13"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Performance
rayon = "1.8" # Parallel iterators
num_cpus = "1.16"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
quickcheck = "1.0"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["parallel", "gpu", "visual-builder", "ai-assistant"]

# Parallel proof generation
parallel = ["ark-std/parallel", "rayon"]

# GPU acceleration
gpu = []

# Visual no-code builder
visual-builder = []

# AI-powered circuit generation
ai-assistant = []

# WebAssembly support
wasm = ["wasm-bindgen", "wasm-bindgen-futures"]

# All proof systems
all-backends = ["groth16", "plonk", "stark", "plonky2", "nova"]

# Individual backends
groth16 = []
plonk = []
stark = []
plonky2 = []
nova = []

# zkVM support
zkvm = []

# Plugin system
plugins = []

# Cross-chain deployment
cross-chain = []

[[bin]]
name = "shroud"
path = "cli/main.rs"

[[bench]]
name = "proof_generation"
harness = false

[[bench]]
name = "circuit_compilation"
harness = false
